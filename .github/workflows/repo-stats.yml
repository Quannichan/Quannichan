name: Update repo stats

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:       # manual run

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count repositories
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          all=$(gh api --paginate "user/repos?affiliation=owner&per_page=100" --jq '.[].private')
          if [ -z "$all" ]; then
            echo "Could not list repositories: check STATS_TOKEN and its permissions"
            exit 1
          fi
          priv=$(echo "$all" | grep -c '^true$' || true)
          pub=$(echo "$all" | grep -c '^false$' || true)
          total=$((pub + priv))
          mkdir -p stats
          mk() { jq -n --arg l "$1" --arg m "$2" --arg c "$3" '{schemaVersion:1,label:$l,message:$m,color:$c}' > "stats/$4.json"; }
          mk "Total Repos" "$total" "0284c7" total
          mk "Public (Visible)" "$pub" "059669" public
          mk "Private (Confidential)" "$priv" "7c3aed" private

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || (git commit -m "chore: update repo stats" && git push)
